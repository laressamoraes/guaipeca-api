server:
  port: 8081

spring:
  application:
    name: guaipeca
  datasource:
    url: jdbc:postgresql://localhost:5435/guaipeca
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true