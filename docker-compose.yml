services:
  guaipeca-db:
    image: postgis/postgis:16-3.4
    container_name: guaipeca-db
    environment:
      POSTGRES_DB: guaipeca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - guaipeca-data:/var/lib/postgresql/data

volumes:
  guaipeca-data: